name: so_account
description: Local-first personal finance and belongings for Android and iOS.
publish_to: none
version: 0.7.0+10
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  archive: ^4.5.2
  xml: ^7.1.0
  html: ^0.15.6
  crypto: ^3.0.7
  sqlite3: ^3.7.1
  cupertino_icons: 1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.7.0
flutter:

name: Mobile checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      device_recovery:
        description: Run isolated Android process recovery scenarios
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Verify SQLite native downloads with retries
        run: python3 tool/prepare_sqlite.py linux android
      - run: dart format --output=none --set-exit-if-changed lib test integration_test benchmark test_driver
      - run: flutter analyze
      - name: Flutter tests with retained output
        run: |
          mkdir -p .tooling/ci-logs
          flutter test --reporter expanded | tee .tooling/ci-logs/flutter-tests.log
      - name: Preserve rendered UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-evidence
          path: .tooling/screenshots/*.png
          if-no-files-found: ignore
      - name: Check generated database
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/data/database/app_database.g.dart
      - name: Build Android with dependency retries
        run: python3 tool/build_android.py
      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: .tooling/ci-logs/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Verify SQLite native downloads with retries
        run: python3 tool/prepare_sqlite.py ios
      - run: flutter build ios --simulator --debug
  device-recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.device_recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: python3 tool/prepare_sqlite.py linux android
      - name: Build dedicated synthetic debug package
        run: flutter build apk --debug --target integration_test/recovery_app.dart -PrecoveryHarness=true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: python3 tool/device_recovery.py --apk build/app/outputs/flutter-apk/app-debug.apk --aapt "$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-recovery
          path: .tooling/device-recovery/
          if-no-files-found: ignore
